---
apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: kube-prometheus-stack-alertmanager
  namespace: monitoring
spec:
  route:
    groupBy:
      - namespace
      - alertname
    groupWait: 30s
    groupInterval: 5m
    repeatInterval: 12h
    receiver: discord
    routes:
      - receiver: "null"
        matchers:
          - name: alertname
            matchType: =
            value: Watchdog
      - receiver: discord
        matchers:
          - name: alertname
            matchType: =
            value: InfoInhibitor
  receivers:
    - name: "null"
    - name: discord
      discordConfigs:
        - apiURL:
            name: alertmanager-discord-webhook
            key: webhook_url
          sendResolved: true
          title: >-
            {{ .Status | toUpper }} · {{ if .CommonLabels.severity }}{{ .CommonLabels.severity | toUpper }}{{ else }}ALERT{{ end }} · {{ .CommonLabels.alertname }} ({{ len .Alerts }})
          message: |-
            {{ range .Alerts }}
            **{{ .Status | toUpper }} · {{ if .Annotations.summary }}{{ .Annotations.summary }}{{ else }}{{ .Labels.alertname }}{{ end }}**
            **Affected:** {{ if .Labels.node }}{{ .Labels.node }}{{ else if and (eq .Labels.job "node-exporter") .Labels.instance }}{{ .Labels.instance }}{{ else }}{{ if .Labels.namespace }}{{ .Labels.namespace }}/{{ end }}{{ if .Labels.pod }}{{ .Labels.pod }}{{ else if .Labels.deployment }}{{ .Labels.deployment }}{{ else if .Labels.persistentvolumeclaim }}{{ .Labels.persistentvolumeclaim }}{{ else if .Labels.name }}{{ .Labels.name }}{{ else if .Labels.instance }}{{ .Labels.instance }}{{ else }}cluster{{ end }}{{ if .Labels.container }} · container {{ .Labels.container }}{{ end }}{{ end }}
            {{ if eq .Status "resolved" }}**Recovered.** Previous alert details:
            {{ end }}{{ if .Annotations.description }}{{ .Annotations.description }}{{ else if not .Annotations.summary }}No description provided by this alert rule.{{ end }}
            {{ if .GeneratorURL }}[Investigate in Prometheus]({{ .GeneratorURL }}){{ else }}[View Prometheus alerts](https://prometheus.cerberus-tilapia.ts.net/alerts){{ end }}{{ if .Annotations.runbook_url }} · [Troubleshooting guide]({{ .Annotations.runbook_url }}){{ end }}
            {{ end }}
  inhibitRules:
    - sourceMatch:
        - name: severity
          matchType: =
          value: critical
      targetMatch:
        - name: severity
          matchType: =~
          value: warning|info
      equal:
        - namespace
        - alertname
    - sourceMatch:
        - name: severity
          matchType: =
          value: warning
      targetMatch:
        - name: severity
          matchType: =
          value: info
      equal:
        - namespace
        - alertname
    - sourceMatch:
        - name: alertname
          matchType: =
          value: InfoInhibitor
      targetMatch:
        - name: severity
          matchType: =
          value: info
      equal:
        - namespace
